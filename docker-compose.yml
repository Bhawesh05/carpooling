version: "3.8"

services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/carpooling
      - JWT_SECRET=change_this_in_production
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongo

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"

  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data:
